<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KUJI SCRATCH</title>

<!-- 외부 이미지 및 상품 데이터 파일 불러오기 -->
<script src="./images.js"></script>

<style>
:root {
  --ink: #f7f4ff;
  --muted: #9aa1bc;
  --paper: #090b19;
  --card: #14182d;
  --line: #303554;
  --accent: #ffdc38;
  --orange: #ff7300;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at 50% -10%, #242050 0%, #0a0c1c 55%, #060711 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  min-height: 100vh;
}
.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  padding: 12px 10px 32px;
  overflow-x: hidden;
}

/* Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid #282d49;
  margin-bottom: 12px;
}
.brand {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .12em;
  color: #fff;
}
.top-actions {
  display: flex;
  gap: 6px;
}
.pill {
  font-size: 11px;
  border: 1px solid #3d4366;
  padding: 5px 10px;
  border-radius: 99px;
  color: #c7c9d8;
  background: #14182d;
  cursor: pointer;
}
.pill.board-btn {
  background: linear-gradient(135deg, #2b1f54, #191c3d);
  border-color: #6956cc;
  color: #ffe899;
  font-weight: 800;
}

/* Screens */
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Home Screen */
.kiosk-intro {
  margin: 10px 0 12px;
}
.kiosk-intro h1 {
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: -.03em;
}
.kiosk-intro h1 em {
  font-style: normal;
  color: var(--accent);
}

.featured-frame {
  height: 175px;
  position: relative;
  overflow: hidden;
  border: 2px solid #5868e8;
  border-radius: 14px;
  background: #14182d;
  box-shadow: 0 0 20px rgba(88, 104, 232, 0.2);
  cursor: pointer;
}
.featured-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.featured-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #090b19 0%, rgba(9, 11, 25, .6) 30%, transparent 75%);
}
.featured-caption {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.featured-caption h2 {
  font-size: 18px;
  letter-spacing: -.02em;
}
.featured-caption p {
  font-size: 10px;
  color: #c5caf0;
}
.board-chip {
  background: rgba(14, 18, 42, 0.85);
  border: 1px solid #7380ff;
  border-radius: 12px;
  padding: 4px 8px;
  font-size: 10px;
  color: #ffdc38;
  font-weight: 800;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 16px 2px 8px;
}
.section-head h2 { font-size: 15px; }

.kuji-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kuji-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 8px;
  border: 1px solid #2d3352;
  border-radius: 12px;
  background: linear-gradient(105deg, #171b33, #0f1224);
  color: #fff;
  cursor: pointer;
}
.kuji-card.selected {
  border: 2px solid #7e8dff;
  background: linear-gradient(105deg, #242a54, #141830);
}
.kuji-card img {
  width: 80px;
  height: 64px;
  object-fit: cover;
  border-radius: 8px;
  background: #20243e;
  flex-shrink: 0;
}
.kuji-copy {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  gap: 2px;
}
.kuji-copy b { font-size: 13px; }
.kuji-copy small { font-size: 9px; color: #a4abdc; }
.kuji-copy .stock-row {
  font-size: 10px;
  color: #c9ceea;
  margin-top: 3px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.stock-tag {
  background: rgba(255, 115, 0, 0.2);
  color: #ff9944;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}

/* Purchase Panel */
.purchase-panel {
  margin-top: 14px;
  padding: 14px;
  border: 1px solid #333a5c;
  border-radius: 14px;
  background: linear-gradient(145deg, #181c36, #101326);
}
.purchase-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid #292f4c;
}
.qty-ctrl { display: flex; align-items: center; gap: 12px; }
.qty-ctrl button {
  width: 32px;
  height: 32px;
  background: #232849;
  color: white;
  border: 1px solid #3f4770;
  border-radius: 50%;
  font-size: 17px;
  cursor: pointer;
}
.qty-ctrl strong { font-size: 18px; min-width: 18px; text-align: center; }
.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 0 14px;
}
.price-row span { font-size: 12px; color: #a8afcc; }
.price-row b { font-size: 20px; color: var(--accent); }

.start-btn {
  width: 100%;
  border: 0;
  border-radius: 30px;
  padding: 13px;
  background: linear-gradient(#ffef6b, #ffd51b);
  color: #19182a;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 3px 0 #b88c08;
}

/* ========================================================
   현황판 SCREEN (잘림 방지 반응형 그리드 & 모바일 최적화)
   ======================================================== */
.board-container {
  width: 100%;
  box-sizing: border-box;
  background: #090c1d;
  border: 2px solid #282f55;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
}

.board-header {
  background: linear-gradient(180deg, #181d3d 0%, #10132b 100%);
  border-bottom: 2px solid #2f365f;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.board-back-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff3377, #d81b60);
  border: 2px solid #ff77a8;
  color: white;
  font-size: 18px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255, 51, 119, 0.4);
  flex-shrink: 0;
}
.board-title-group {
  text-align: center;
  flex: 1;
  min-width: 0;
}
.board-title-group h1 {
  font-size: 17px;
  font-weight: 900;
  color: #ffffff;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.board-counter-group {
  text-align: right;
  flex-shrink: 0;
  background: rgba(14, 18, 38, 0.9);
  border: 1px solid #343b66;
  border-radius: 8px;
  padding: 3px 7px;
}
.board-counter-group .counter-lbl {
  font-size: 7.5px;
  color: #929bbd;
  display: block;
}
.board-counter-group .counter-val {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
}
.board-counter-group .counter-val strong { color: #ffdc38; }

/* Pegboard Grid — 잘림 방지 100% minmax(0, 1fr) */
.board-peg-surface {
  width: 100%;
  box-sizing: border-box;
  background-color: #0b0e20;
  background-image: radial-gradient(#1c2240 1.5px, transparent 1.5px);
  background-size: 12px 12px;
  padding: 8px 6px 12px;
}

.board-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  box-sizing: border-box;
}

/* Compact Mobile Board Card */
.board-card {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  background: linear-gradient(135deg, #ffffff 0%, #f4f6fd 60%, #e6eefc 100%);
  border-radius: 9px;
  border: 1px solid #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  padding: 5px 6px;
  color: #171a2e;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 66px;
  overflow: hidden;
}
.board-card.soldout {
  background: linear-gradient(135deg, #e7ebf3 0%, #d4dae6 100%);
  opacity: 0.85;
}
.board-card-top {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-width: 0;
}

/* Grade Medal */
.grade-medal {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff2b2 0%, #d4af37 40%, #8f6a15 80%, #594008 100%);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.grade-medal-inner {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #23273e 0%, #0d0f1b 100%);
  border: 1px solid #e5c365;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffdf7a;
  line-height: 1;
}
.grade-medal-inner .medal-letter { font-size: 10.5px; font-weight: 900; }
.grade-medal-inner .medal-sub { font-size: 5.5px; font-weight: 800; }

.grade-medal.last-one {
  background: radial-gradient(circle at 35% 30%, #ff8db7 0%, #e91e63 45%, #9c1040 85%, #5a0522 100%);
}
.grade-medal.last-one .grade-medal-inner {
  border-color: #ff8db7; color: #fff; background: #230814;
}
.grade-medal.last-one .medal-letter { font-size: 7.5px; font-weight: 1000; }

.grade-medal.double-chance {
  background: radial-gradient(circle at 35% 30%, #c49eff 0%, #6f42c1 45%, #3d1b7d 85%, #20084c 100%);
}
.grade-medal.double-chance .grade-medal-inner {
  border-color: #c49eff; color: #72f7d1; background: #130a28;
}
.grade-medal.double-chance .medal-letter { font-size: 7.5px; font-weight: 1000; }

.board-card-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.board-card-title {
  font-size: 10.5px;
  font-weight: 900;
  color: #171b30;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.board-card-thumb {
  width: 25px;
  height: 25px;
  object-fit: contain;
  background: #fff;
  border-radius: 4px;
  border: 1px solid #dae2f0;
  flex-shrink: 0;
}

/* Ticket Strip & Remain — Responsive */
.board-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3px;
  background: rgba(228, 233, 245, 0.75);
  border-radius: 5px;
  padding: 2px 4px;
  margin-top: 4px;
  min-width: 0;
  width: 100%;
  box-sizing: border-box;
}
.ticket-strip {
  display: flex;
  align-items: center;
  gap: 1px;
  background: #121526;
  border-radius: 3px;
  padding: 1.5px 2px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 0;
}
.ticket-slot {
  width: 6.5px;
  height: 8.5px;
  border-radius: 1px;
  font-size: 5.5px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ticket-slot.active {
  background: linear-gradient(180deg, #ff953f 0%, #f05a00 100%);
  color: #ffffff;
}
.ticket-slot.drawn {
  background: #25283a;
  color: #4b526f;
  text-decoration: line-through;
  opacity: 0.55;
}
.remain-box {
  display: flex;
  align-items: baseline;
  gap: 2px;
  flex-shrink: 0;
  white-space: nowrap;
}
.remain-label { font-size: 6.5px; color: #6a7495; font-weight: 700; }
.remain-count {
  font-size: 12px;
  font-weight: 1000;
  color: #0b1a4a;
}
.remain-count.zero { color: #cc2233; }
.sold-badge {
  font-size: 7.5px;
  font-weight: 900;
  color: #fff;
  background: #d32f2f;
  padding: 1px 3px;
  border-radius: 2px;
}

/* Board Footer */
.board-footer {
  background: #11142b;
  border-top: 1px solid #2a3152;
  padding: 10px 12px;
  display: flex;
  gap: 8px;
}
.board-btn {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font-weight: 900;
  font-size: 13px;
  cursor: pointer;
}
.board-btn.primary {
  background: linear-gradient(180deg, #ffef6b, #ffd51b);
  color: #19182a;
}
.board-btn.secondary {
  background: #232947;
  color: #d2d7f3;
  border: 1px solid #3c456d;
}

/* ========================================================
   Scratch Box — 결과 사전 노출 방지(누출 차단 커버)
   ======================================================== */
#scratch .title, #summary .title { color: #fff; font-size: 22px; margin: 4px 0 8px; }
#scratch .sub, #summary .sub { color: #9aa1bc; font-size: 12px; }

.scratchbox {
  position: relative;
  margin-top: 10px;
  background: #16192e; /* 캔버스 로딩 중 밑바탕 암전 */
  border-radius: 14px;
  overflow: hidden;
  height: 260px;
}
.scratchbox img {
  display: block;
  width: 100%;
  height: 260px;
  object-fit: contain;
  background: #fff;
  border-radius: 14px;
  opacity: 0; /* 캔버스 코팅이 완전히 칠해지기 전까지 100% 투명 숨김 */
  transition: opacity .12s ease;
}
.scratchbox canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  border-radius: 14px;
  z-index: 2; /* 캔버스가 항상 이미지 위에 완벽 밀착 */
}

.tag { display: inline-block; border-radius: 99px; background: #352d49; color: #fff; padding: 5px 10px; font-size: 11px; font-weight: 900; }
.results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
.result { border: 1px solid #2e3557; background: #13172c; border-radius: 10px; padding: 8px; color: #fff; }
.result img { width: 100%; height: 125px; object-fit: contain; background: #fff; border-radius: 6px; }
.result b { font-size: 11px; display: block; margin-top: 4px; }
.btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: 800;
  margin-top: 12px;
  background: var(--accent);
  color: #17182a;
  cursor: pointer;
}
.btn.secondary {
  background: #232947;
  color: #d2d7f3;
  border: 1px solid #3c456d;
  margin-top: 8px;
}
.btn:disabled { opacity: .45; }

@media (max-width: 360px) {
  .app { padding: 10px 6px 24px; }
  .board-peg-surface { padding: 6px 4px 10px; }
  .board-grid { gap: 4px; }
  .board-card { padding: 4px 4px; }
  .board-card-title { font-size: 9.5px; }
}
</style>
</head>
<body>
<main class="app">

<!-- Header -->
<div class="top">
  <div class="brand">🎯 KUJI SCRATCH</div>
  <div class="top-actions">
    <button id="topBoardBtn" class="pill board-btn" type="button">📊 실시간 현황판</button>
  </div>
</div>

<!-- ==============================================
     SCREEN 1: HOME
     ============================================== -->
<section id="home" class="screen active">
  <div class="kiosk-intro">
    <h1>원하는 <em>쿠지</em>를 선택하세요</h1>
  </div>

  <div class="featured-frame" id="featuredBox">
    <img id="featuredImg" src="" alt="쿠지">
    <div class="featured-shade"></div>
    <div class="featured-caption">
      <div>
        <h2 id="featuredTitle">Hearts2Hearts</h2>
        <p id="featuredDesc">GOODS COLLECTION</p>
      </div>
      <div class="board-chip">현황판 보기 ↗</div>
    </div>
  </div>

  <div class="section-head">
    <h2>쿠지 라인업</h2>
    <button class="pill" id="lineupBoardBtn" type="button">📊 현황판</button>
  </div>

  <div class="kuji-list" id="lineupList">
    <!-- Rendered dynamically from KUJI_DATA -->
  </div>

  <div class="purchase-panel">
    <div class="purchase-row">
      <span style="font-size:13px; color:#a8afcc;">뽑을 수량</span>
      <div class="qty-ctrl">
        <button id="minus" type="button">−</button>
        <strong id="qty">5</strong>
        <button id="plus" type="button">+</button>
      </div>
    </div>
    <div class="price-row">
      <span>결제 금액</span>
      <b id="total">₩ 25,000</b>
    </div>
    <button id="pay" class="start-btn" type="button">시작하기 →</button>
  </div>
</section>

<!-- ==============================================
     SCREEN 2: 현황판 (잘림 방지 반응형)
     ============================================== -->
<section id="board" class="screen">
  <div class="board-container">
    <div class="board-header">
      <button class="board-back-btn" id="boardBackBtn" type="button">←</button>
      <div class="board-title-group">
        <h1 id="boardThemeTitle">Hearts2Hearts</h1>
      </div>
      <div class="board-counter-group">
        <span class="counter-lbl">잔여 / 총수량</span>
        <div class="counter-val">
          <strong id="boardRemainCount">60</strong>/<span id="boardTotalCount">60</span>
        </div>
      </div>
    </div>

    <div class="board-peg-surface">
      <div class="board-grid" id="boardGrid">
        <!-- Compact cards -->
      </div>
    </div>

    <div class="board-footer">
      <button class="board-btn secondary" id="btnResetBox" type="button">🔄 새 판 개봉</button>
      <button class="board-btn primary" id="btnDrawFromBoard" type="button">🎯 이 판 뽑기</button>
    </div>
  </div>
</section>

<!-- ==============================================
     SCREEN 3: SCRATCH (결과 사전 노출 100% 방지)
     ============================================== -->
<section id="scratch" class="screen">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span class="tag" id="progress">1 / 5</span>
    <button class="pill" id="scratchToBoardBtn" type="button">📊 판 현황</button>
  </div>

  <div class="scratchbox" id="scratchbox">
    <img id="prizeImg" alt="상품 이미지">
    <canvas id="scratchCanvas"></canvas>
  </div>

  <div id="prizeMeta" style="margin-top:10px; visibility:hidden">
    <span class="tag" id="grade" style="background:#553f7c;">-</span>
    <h2 id="prizeName" class="title" style="margin-top:4px;">-</h2>
  </div>

  <button id="next" class="btn" disabled>다음 티켓</button>
</section>

<!-- ==============================================
     SCREEN 4: SUMMARY
     ============================================== -->
<section id="summary" class="screen">
  <h2 class="title">당첨 결과</h2>
  <div class="results" id="results"></div>
  <button id="summaryToBoardBtn" class="btn" type="button">📊 실시간 현황판 보기</button>
  <button id="again" class="btn secondary" type="button">다시 뽑기</button>
</section>

</main>

<script>
/* ========================================================
   1. DATA INITIALIZATION & FALLBACK
   ======================================================== */
const defaultData = {
  themes: {
    h2h: {
      name: "Hearts2Hearts",
      sub: "PHOTO & GOODS",
      cover: "https://i.namu.wiki/i/2ZtiTWq8hkjJfjC0dWlf3AvhYkjJH3h1QdBuPN_fzmogtYwsleqALb_1bgIKV4qPi6pf-u0zAn1i5wp1a2A9Dw.webp",
      lastOne: { name: "라스트원상 스페셜 친필사인 포토보드", image: "https://fcdn2.smtown-official.jp/files/images/2141_4ccd9d0a27809492fd3ccb3b8be86b84.jpg" },
      doubleChance: { name: "더블찬스 풀 패키지 굿즈 세트", image: "https://media.ktown4u.com/products/resize/thumbnail/2026/06/29/AH6JfX.png" }
    },
    tuide: {
      name: "TUIDE",
      sub: "ALBUM & GOODS",
      cover: "https://dimg.donga.com/wps/NEWS/IMAGE/2026/08/25/134538691.1.jpg",

const AppData = (window.KUJI_DATA && window.KUJI_DATA.themes) ? window.KUJI_DATA : defaultData;
const themes = AppData.themes;
const grades = AppData.grades;

/* ========================================================
   2. BOX / INVENTORY STATE
   ======================================================== */
const themeBoxes = {};
function initBox(tKey) {
  let tickets = [];
  grades.forEach(g => {
    for (let i = 0; i < g.count; i++) {
      const pInfo = (g.prizes && g.prizes[tKey]) ? g.prizes[tKey] : { name: `${g.key}상`, image: "" };
      tickets.push({
        key: g.key,
        name: pInfo.name,
        image: pInfo.image,
        drawn: false
      });
    }
  });
  for (let i = tickets.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [tickets[i], tickets[j]] = [tickets[j], tickets[i]];
  }
  themeBoxes[tKey] = { tickets, totalCount: tickets.length, lastOneAwarded: false };
}
Object.keys(themes).forEach(initBox);

let theme = "h2h", qty = 5, results = [], current = null, lastScreen = "home", idx = 0;
let ctx = null, down = false, last = null, checked = false;

const $ = id => document.getElementById(id);
const won = n => "₩ " + n.toLocaleString("ko-KR");

function placeholder(text) {
  let colors = { A: "#f6d8a8", B: "#d9e8ff", C: "#e7d7f7", D: "#ffe2e5", E: "#d9f0df", F: "#ece8e0" };
  const bg = colors[text] || "#e4e7f8";
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="300" height="300" rx="16" fill="${bg}"/><text x="150" y="170" text-anchor="middle" font-size="70" font-family="sans-serif" font-weight="900" fill="#222">${text}</text></svg>`);
}

function show(id) {
  const active = document.querySelector(".screen.active");
  if (active && active.id !== id) lastScreen = active.id;
  document.querySelectorAll(".screen").forEach(x => x.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
  if (id === "board") renderBoard();
}

/* ========================================================
   3. HOME SCREEN
   ======================================================== */
function renderLineup() {
  const list = $("lineupList");
  list.innerHTML = "";
  Object.keys(themes).forEach(tKey => {
    const t = themes[tKey];
    const box = themeBoxes[tKey];
    const rem = box.tickets.filter(tk => !tk.drawn).length;

    const btn = document.createElement("button");
    btn.className = "kuji-card" + (tKey === theme ? " selected" : "");
    btn.dataset.theme = tKey;
    btn.type = "button";

    btn.innerHTML = `
      <img src="${t.cover || placeholder(t.name[0])}" alt="${t.name}" onerror="this.src='${placeholder(t.name[0])}'">
      <span class="kuji-copy">
        <b>${t.name}</b>
        <small>${t.sub}</small>
        <span class="stock-row">
          <span class="stock-tag" id="stockBadge-${tKey}">잔여 ${rem}/${box.totalCount}</span>
          <span>1회 ₩5,000</span>
        </span>
      </span>
      <span style="color:var(--accent); font-size:20px;">›</span>
    `;

    btn.onclick = () => {
      theme = tKey;
      update();
      updateFeatured();
    };
    list.appendChild(btn);
  });
}

function update() {
  const box = themeBoxes[theme];
  const rem = box.tickets.filter(t => !t.drawn).length;
  $("qty").textContent = qty;
  $("total").textContent = won(qty * 5000);
  $("pay").disabled = (rem === 0);
  $("pay").textContent = (rem === 0) ? "완판 (새 판 필요)" : "시작하기 →";

  Object.keys(themes).forEach(tKey => {
    const b = themeBoxes[tKey];
    const r = b.tickets.filter(t => !t.drawn).length;
    const badge = $(`stockBadge-${tKey}`);
    if (badge) badge.textContent = `잔여 ${r}/${b.totalCount}`;
  });

  document.querySelectorAll(".kuji-card").forEach(b => {
    b.classList.toggle("selected", b.dataset.theme === theme);
  });
}

function updateFeatured() {
  const t = themes[theme];
  const img = $("featuredImg");
  img.onerror = () => { img.onerror = null; img.src = placeholder(t.name[0]); };
  img.src = t.cover || placeholder(t.name[0]);
  $("featuredTitle").textContent = t.name;
  $("featuredDesc").textContent = t.sub;
}

$("minus").onclick = () => { qty = Math.max(1, qty - 1); update(); };
$("plus").onclick = () => {
  const rem = themeBoxes[theme].tickets.filter(t => !t.drawn).length;
  qty = Math.min(Math.min(10, rem || 1), qty + 1);
  update();
};

/* ========================================================
   4. 현황판 RENDER (잘림 없는 minmax 반응형 카드)
   ======================================================== */
function renderBoard() {
  const t = themes[theme];
  const box = themeBoxes[theme];
  const remaining = box.tickets.filter(t => !t.drawn);

  $("boardThemeTitle").textContent = t.name;
  $("boardRemainCount").textContent = remaining.length;
  $("boardTotalCount").textContent = box.totalCount;

  const grid = $("boardGrid");
  grid.innerHTML = "";

  grades.forEach(g => {
    const remGrade = remaining.filter(tk => tk.key === g.key).length;
    const drawnGrade = g.count - remGrade;
    const isZero = (remGrade === 0);
    const pInfo = (g.prizes && g.prizes[theme]) ? g.prizes[theme] : { name: `${g.key}상`, image: "" };

    const card = document.createElement("div");
    card.className = "board-card" + (isZero ? " soldout" : "");

    const top = document.createElement("div");
    top.className = "board-card-top";
    top.innerHTML = `
      <div class="grade-medal">
        <div class="grade-medal-inner">
          <span class="medal-letter">${g.key}</span>
          <span class="medal-sub">상</span>
        </div>
      </div>
      <div class="board-card-info">
        <div class="board-card-title">${pInfo.name}</div>
      </div>
      <img class="board-card-thumb" src="${pInfo.image || placeholder(g.key)}" alt="${g.key}" onerror="this.src='${placeholder(g.key)}'">
    `;

    const bottom = document.createElement("div");
    bottom.className = "board-card-bottom";

    const strip = document.createElement("div");
    strip.className = "ticket-strip";
    for (let i = 0; i < remGrade; i++) {
      strip.innerHTML += `<span class="ticket-slot active">${g.key}</span>`;
    }
    for (let i = 0; i < drawnGrade; i++) {
      strip.innerHTML += `<span class="ticket-slot drawn">${g.key}</span>`;
    }

    const remainBox = document.createElement("div");
    remainBox.className = "remain-box";
    if (isZero) {
      remainBox.innerHTML = `<span class="sold-badge">매진</span>`;
    } else {
      remainBox.innerHTML = `<span class="remain-label">잔여</span><span class="remain-count">${remGrade}</span>`;
    }

    bottom.append(strip, remainBox);
    card.append(top, bottom);
    grid.appendChild(card);
  });

  // Last One Card
  const lastCard = document.createElement("div");
  lastCard.className = "board-card";
  const loStatus = box.lastOneAwarded ? "완료" : "1";
  lastCard.innerHTML = `
    <div class="board-card-top">
      <div class="grade-medal last-one">
        <div class="grade-medal-inner"><span class="medal-letter">LAST</span></div>
      </div>
      <div class="board-card-info">
        <div class="board-card-title">${t.lastOne.name}</div>
      </div>
      <img class="board-card-thumb" src="${t.lastOne.image}" alt="LAST" onerror="this.src='${placeholder("L")}'">
    </div>
    <div class="board-card-bottom">
      <span style="font-size:7px; color:#d81b60; font-weight:800; white-space:nowrap;">마지막 1장 지급</span>
      <div class="remain-box"><span class="remain-label">잔여</span><span class="remain-count" style="color:#d81b60">${loStatus}</span></div>
    </div>
  `;
  grid.appendChild(lastCard);

  // Double Chance Card
  const dcCard = document.createElement("div");
  dcCard.className = "board-card";
  dcCard.innerHTML = `
    <div class="board-card-top">
      <div class="grade-medal double-chance">
        <div class="grade-medal-inner"><span class="medal-letter">W</span></div>
      </div>
      <div class="board-card-info">
        <div class="board-card-title">${t.doubleChance.name}</div>
      </div>
      <img class="board-card-thumb" src="${t.doubleChance.image}" alt="W" onerror="this.src='${placeholder("W")}'">
    </div>
    <div class="board-card-bottom">
      <span style="font-size:7px; color:#72f7d1; font-weight:800; white-space:nowrap;">추첨권</span>
      <div class="remain-box"><span class="remain-label" style="font-size:7px;">추첨</span></div>
    </div>
  `;
  grid.appendChild(dcCard);
}

$("boardBackBtn").onclick = () => show(lastScreen || "home");
$("topBoardBtn").onclick = () => show("board");
$("lineupBoardBtn").onclick = () => show("board");
$("featuredBox").onclick = () => show("board");
$("scratchToBoardBtn").onclick = () => show("board");
$("summaryToBoardBtn").onclick = () => show("board");

$("btnDrawFromBoard").onclick = () => {
  show("home");
  $("pay").scrollIntoView({ behavior: "smooth" });
};

$("btnResetBox").onclick = () => {
  if (confirm(`'${themes[theme].name}' 판을 60매로 초기화할까요?`)) {
    initBox(theme);
    update();
    renderBoard();
  }
};

/* ========================================================
   5. SCRATCH ENGINE (결과 사전 노출 원천 차단)
   ======================================================== */
$("pay").onclick = () => {
  const box = themeBoxes[theme];
  const unDrawn = box.tickets.filter(t => !t.drawn);
  if (!unDrawn.length) {
    alert("판이 완판되었습니다. 새 판을 개봉해주세요!");
    show("board");
    return;
  }
  const count = Math.min(qty, unDrawn.length);
  results = [];
  for (let i = 0; i < count; i++) {
    const list = box.tickets.filter(t => !t.drawn);
    if (!list.length) break;
    const picked = list[Math.floor(Math.random() * list.length)];
    picked.drawn = true;
    results.push(picked);

    if (box.tickets.filter(t => !t.drawn).length === 0 && !box.lastOneAwarded) {
      box.lastOneAwarded = true;
      results.push({
        key: "LAST",
        name: themes[theme].lastOne.name,
        image: themes[theme].lastOne.image,
        isLastOne: true
      });
    }
  }
  idx = 0;
  begin();
};

function begin() {
  if (idx >= results.length) { summary(); return; }
  current = results[idx];

  // [차단 1] 화면 전환 전, 이전/새 상품 이미지와 텍스트를 즉시 100% 암전 은폐
  const im = $("prizeImg");
  im.style.opacity = "0";
  im.src = "";

  $("prizeMeta").style.visibility = "hidden";
  $("grade").textContent = "등급 미공개";
  $("prizeName").textContent = "???";
  $("progress").textContent = (idx + 1) + " / " + results.length;

  $("next").disabled = true;
  $("next").textContent = (idx + 1 === results.length) ? "결과 보기" : "다음 티켓";

  show("scratch");

  // 화면이 렌더링된 직후 캔버스 불투명 코팅을 먼저 완성하고 이미지를 뒤에 배치
  requestAnimationFrame(() => {
    setupCanvas();
  });
}

function setupCanvas() {
  let can = $("scratchCanvas"), box = $("scratchbox");
  let r = box.getBoundingClientRect();
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  let w = r.width || box.clientWidth || 340;
  let h = 260;

  can.width = w * dpr;
  can.height = h * dpr;
  can.style.width = w + "px";
  can.style.height = h + "px";

  ctx = can.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // [차단 2] 100% 완벽한 불투명 실버 메탈릭 코팅을 먼저 화면 전체에 도포
  ctx.globalCompositeOperation = "source-over";
  let grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, "#c2c1be");
  grad.addColorStop(0.5, "#ecebe8");
  grad.addColorStop(1, "#b5b4ad");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = "#3e3a35";
  ctx.textAlign = "center";
  ctx.font = "900 19px sans-serif";
  ctx.fillText("★ SCRATCH HERE ★", w / 2, h / 2 - 8);
  ctx.font = "700 12px sans-serif";
  ctx.fillStyle = "#5e5952";
  ctx.fillText("화면을 문질러 당첨 결과를 확인하세요", w / 2, h / 2 + 16);

  checked = false;

  // [차단 3] 캔버스 코팅이 완전히 덮인 것을 확인한 뒤에야 상품 이미지를 캔버스 뒤(z-index: 1)에 안전 로딩
  const im = $("prizeImg");
  const fb = placeholder(current.key || "A");
  im.onerror = () => { im.onerror = null; im.src = fb; };
  im.src = current.image || fb;
  // 캔버스 코팅 뒤에서 부드럽게 대기 (사용자는 오직 은색 코팅만 보임)
  im.style.opacity = "1";
}

function pos(e) {
  let r = $("scratchCanvas").getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function stroke(e) {
  if (!down || !ctx || checked) return;
  e.preventDefault();
  let p = pos(e);
  ctx.globalCompositeOperation = "destination-out";
  ctx.lineWidth = 42;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  if (last) ctx.moveTo(last.x, last.y); else ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  last = p;
}

function reveal() {
  if (checked || !current) return;
  checked = true; down = false; last = null;
  ctx.clearRect(0, 0, $("scratchCanvas").width, $("scratchCanvas").height);
  $("prizeMeta").style.visibility = "visible";
  $("grade").textContent = current.key === "LAST" ? "LAST ONE" : current.key + "상";
  $("prizeName").textContent = current.name;
  $("next").disabled = false;
  idx++;
}

const can = $("scratchCanvas");
can.addEventListener("pointerdown", e => { if (checked) return; down = true; last = pos(e); can.setPointerCapture?.(e.pointerId); stroke(e); });
can.addEventListener("pointermove", stroke);
function stop() {
  if (!down) return;
  down = false; last = null;
  if (!checked) {
    const c = $("scratchCanvas"), small = document.createElement("canvas");
    small.width = 20; small.height = 12;
    let x = small.getContext("2d");
    x.drawImage(c, 0, 0, 20, 12);
    let data = x.getImageData(0, 0, 20, 12).data, clear = 0;
    for (let i = 3; i < data.length; i += 4) if (data[i] < 30) clear++;
    if (clear > 30) reveal();
  }
}
can.addEventListener("pointerup", stop);
can.addEventListener("pointercancel", stop);

$("next").onclick = () => { if (!checked) return; begin(); };

function summary() {
  let out = $("results");
  out.innerHTML = "";
  results.forEach(g => {
    let card = document.createElement("div");
    card.className = "result";
    let im = document.createElement("img");
    im.alt = g.name;
    const fb = placeholder(g.key || "A");
    im.onerror = () => { im.onerror = null; im.src = fb; };
    im.src = g.image || fb;

    let b = document.createElement("b");
    b.textContent = g.name;
    if (g.isLastOne) {
      b.style.color = "#ff3377";
      b.textContent = "★ " + g.name;
    }
    card.append(im, b);
    out.append(card);
  });
  show("summary");
  update();
}

$("again").onclick = () => { qty = 5; update(); show("home"); };

// Start App
renderLineup();
update();
updateFeatured();
</script>
